let LEAFLET = null;
function loadLeaflet(){
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (LEAFLET) return LEAFLET;
  LEAFLET = new Promise((res, rej) => {
    const css = document.createElement('link');
    Object.assign(css, { rel:'stylesheet', href:LEAFLET_SRC.css.href, integrity:LEAFLET_SRC.css.sri, crossOrigin:'anonymous', referrerPolicy:'no-referrer' });
    document.head.appendChild(css);
    const s = document.createElement('script');
    Object.assign(s, { src:LEAFLET_SRC.js.href, integrity:LEAFLET_SRC.js.sri, crossOrigin:'anonymous', referrerPolicy:'no-referrer' });
    s.onload = () => (window.L && window.L.map) ? res(window.L) : rej(new Error('Leaflet загрузился не полностью'));
    s.onerror = () => rej(new Error('Не загрузился Leaflet'));
    document.head.appendChild(s);
  });
  LEAFLET.catch(() => { LEAFLET = null; });
  return LEAFLET;
}

let renderedKey = null;
const GMAP = {
  st:null,
  has(id){ return OFFICE_LOCS.some(o => o.id === id); },

  mount(sub){
    const root = app.querySelector('#gta');
    if (!root) return;
    const st = this.st = { root, map:null, radar:null, layer:null, zoom:null, sel:null, marks:{}, tipT:0, raf:0, io:null, ready:false, failed:false, mq:matchMedia('(max-width:700px)') };
    root.addEventListener('click', e => { const b = e.target.closest('[data-gloc]'); if (b) this.select(b.dataset.gloc, { user:true }); });
    /* один адрес — выбран сразу; адрес из ссылки — тоже */
    const first = this.has(sub) ? sub : (OFFICE_LOCS.length === 1 ? OFFICE_LOCS[0].id : null);
    if (first) this.select(first, { fly:false });
    /* загрузка — только когда карта попала в экран */
    st.io = new IntersectionObserver(es => {
      if (es.some(e => e.isIntersecting)){ st.io.disconnect(); this.start(st); }
    }, { threshold:.35 });
    st.io.observe(root);
  },

  unmount(){
    const st = this.st; if (!st) return;
    this.st = null;
    if (st.io) st.io.disconnect();
    clearInterval(st.tipT); cancelAnimationFrame(st.raf); clearTimeout(st.failT);
    if (st.onMq) st.mq.removeEventListener('change', st.onMq);
    try { if (st.map) st.map.remove(); } catch(e){}
    try { if (st.radar) st.radar.remove(); } catch(e){}
  },

  /* экран загрузки: прогресс по реальным тайлам, минимум ~1,8 c, максимум 8 c */
  start(st){
    const load = st.root.querySelector('#gta-load'), bar = load.querySelector('.gta-bar i'), tipEl = load.querySelector('#gta-tip');
    const tips = gtaTips(); let tipI = 0;
    st.tipT = setInterval(() => {
      if (this.st !== st) return clearInterval(st.tipT);
      tipEl.classList.add('swap');
      setTimeout(() => { if (this.st !== st) return; tipI = (tipI + 1) % tips.length; tipEl.innerHTML = `<b>${t('gTip')}:</b> ${tips[tipI]}`; tipEl.classList.remove('swap'); }, reduced() ? 0 : 350);
    }, 2200);

    const t0 = performance.now(); let prog = 0, target = .06;
    st.failT = setTimeout(() => { if (this.st === st && !st.map) this.fail(st); }, GMAP_CFG.maxLoad);
    const step = now => {
      if (this.st !== st || st.failed) return;
      const goal = Math.min(target, (now - t0)/GMAP_CFG.minLoad);
      prog += (goal - prog)*.12;
      bar.style.transform = `scaleX(${prog.toFixed(4)})`;
      if (target >= 1 && goal >= 1 && prog > .995){ bar.style.transform = 'scaleX(1)'; this.finish(st); return; }
      st.raf = requestAnimationFrame(step);
    };
    st.raf = requestAnimationFrame(step);

    loadLeaflet().then(LF => {
      if (this.st !== st) return;
      target = .3;
      const map = st.map = LF.map(st.root.querySelector('#gta-map'), {
        zoomControl:false, scrollWheelZoom:false, minZoom:10, maxZoom:18,
        maxBounds:GMAP_CFG.bounds, maxBoundsViscosity:.8, zoomSnap:.5
      }).setView(GMAP_CFG.city, GMAP_CFG.cityZoom);
      map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
      const layer = st.layer = LF.tileLayer(GMAP_CFG.tiles.url, { maxZoom:GMAP_CFG.tiles.maxZoom, attribution:GMAP_CFG.tiles.attribution }).addTo(map);
      let n = 0;
      layer.on('tileload tileerror', () => { n++; target = Math.max(target, .3 + .6*Math.min(1, n/16)); });
      layer.once('load', () => { target = 1; });
      setTimeout(() => { target = 1; }, GMAP_CFG.maxLoad);

      const pos = () => st.mq.matches ? 'topright' : 'bottomright';
      st.zoom = LF.control.zoom({ position:pos(), zoomInTitle:t('mapZoomIn'), zoomOutTitle:t('mapZoomOut') }).addTo(map);
      st.onMq = () => st.zoom.setPosition(pos());
      st.mq.addEventListener('change', st.onMq);

      const fx = document.createElement('div'); fx.className = 'gta-fx'; map.getContainer().appendChild(fx);
      const coords = st.root.querySelector('#gta-coords');
      map.on('move', () => { const c = map.getCenter(); coords.textContent = gtaLL(c.lat, c.lng); });

      OFFICE_LOCS.forEach((o, i) => {
        const icon = LF.divIcon({ className:'gta-mk', iconSize:[34, 34], iconAnchor:[17, 17],
          html:`<div class="gta-blip"><span class="gta-ring"></span><span class="gta-dot">${i + 1}</span></div><span class="gta-tag"><i>${o.code}</i><b>${L(o.addr)}</b></span>` });
        st.marks[o.id] = LF.marker([o.lat, o.lng], { icon, title:`${o.code}: ${L(o.addr)}`, alt:`${o.code}: ${L(o.addr)}`, riseOnHover:true })
          .addTo(map).on('click', () => this.select(o.id, { user:true }));
      });
      this.paint(st);
    }).catch(e => { console.error(e); if (this.st === st) this.fail(st); });
  },

  fail(st){
    st.failed = true;
    clearInterval(st.tipT); cancelAnimationFrame(st.raf);
    st.root.classList.add('failed');
    st.root.querySelector('#gta-load').classList.add('err');
  },

  finish(st){
    clearInterval(st.tipT); clearTimeout(st.failT);
    const load = st.root.querySelector('#gta-load'), map = st.map;
    load.classList.add('done');
    setTimeout(() => { if (this.st === st) load.hidden = true; }, reduced() ? 0 : 750);
    map.invalidateSize();
    st.ready = true;
    const o = OFFICE_LOCS.find(x => x.id === st.sel);
    const opt = reduced() ? { animate:false } : { duration:2.4, easeLinearity:.2 };
    if (o) map.flyTo([o.lat, o.lng], GMAP_CFG.locZoom, opt);
    else map.flyToBounds(window.L.latLngBounds(OFFICE_LOCS.map(x => [x.lat, x.lng])).pad(.6), reduced() ? { animate:false } : { duration:2.2, easeLinearity:.2 });
    if (o) this.radar(st, o);
  },

  /* выбор адреса — из списка, по метке или из адресной строки */
  select(id, { user=false, fly=true, push=true }={}){
    const st = this.st, o = OFFICE_LOCS.find(x => x.id === id);
    if (!st || !o) return;
    st.sel = id;
    this.paint(st);
    if (fly && st.ready) st.map.flyTo([o.lat, o.lng], GMAP_CFG.locZoom, reduced() ? { animate:false } : { duration:2.4, easeLinearity:.2 });
    const h = `#${renderedKey}/${id}`;
    if (user && push && location.hash !== h) history.pushState(null, '', h);
    this.card(st, o);
    if (user){ const c = st.root.parentElement.querySelector('#gta-card'); requestAnimationFrame(() => c.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block:'center' })); }
  },

  /* «назад»/«вперёд»: true — обработано без перерисовки страницы */
  fromRoute(sub){
    if (!this.st) return false;
    if (this.has(sub)){ this.select(sub, { push:false }); scrollToId('gta-sec'); return true; }
    if (!sub) return true;
    return false;
  },

  paint(st){
    st.root.querySelectorAll('[data-gloc]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.gloc === st.sel)));
    Object.entries(st.marks).forEach(([id, m]) => {
      const el = m.getElement(); if (el) el.classList.toggle('on', id === st.sel);
      m.setZIndexOffset(id === st.sel ? 1000 : 0);
    });
  },

  card(st, o){
    const c = st.root.parentElement.querySelector('#gta-card');
    c.hidden = false;
    c.innerHTML = `
      <div class="gta-radar" role="img" aria-label="${t('gRadar')}">
        <div class="gta-radar-in"><div class="gta-radar-map"></div><div class="gta-fx"></div><div class="gta-sweep"></div><span class="gta-me"></span></div>
      </div>
      <div class="gta-info">
        <p class="gta-code">${o.code}</p>
        <h3>${L(o.addr)}</h3>
        <p>${L(o.note)}</p>
        <p class="gta-ll">${gtaLL(o.lat, o.lng)}</p>
        <div class="cta-row">
          <a class="btn btn-red" href="${o.route}" target="_blank" rel="noopener noreferrer" aria-label="${t('gRouteAria')}">${icon('route')}<span>${t('gRoute')}</span></a>
          <a class="btn btn-line" href="${telHref}">${icon('phone')}<span>${COMPANY.phone.display}</span></a>
        </div>
      </div>`;
    if (st.radar){ try { st.radar.remove(); } catch(e){} st.radar = null; }
    if (st.ready) this.radar(st, o);
  },

  /* мини-радар как в GTA 5: маленькая неподвижная карта в круге */
  radar(st, o){
    const host = st.root.parentElement.querySelector('.gta-radar-map');
    if (!host || !window.L || st.radar) return;
    const LF = window.L;
    st.radar = LF.map(host, { zoomControl:false, attributionControl:false, dragging:false, touchZoom:false, doubleClickZoom:false,
      scrollWheelZoom:false, boxZoom:false, keyboard:false, tap:false, inertia:false }).setView([o.lat, o.lng], GMAP_CFG.radarZoom);
    LF.tileLayer(GMAP_CFG.tiles.url, { maxZoom:GMAP_CFG.tiles.maxZoom }).addTo(st.radar);
  }
};

window.addEventListener('hashchange', () => {
  /* «назад»/«вперёд» между адресами на той же странице — без перерисовки */
  const r = currentRoute();
  if (r.key === renderedKey && GMAP.st && GMAP.fromRoute(r.sub)) return;
  render();
});
buildChrome();
render();
