<style>
/* ====== Фирменные токены. Цвета сняты с присланного логотипа ====== */
:root{
  --brand:#211F20;      /* фон логотипа */
  --black:#161516;
  --graphite:#2D2B2C; --graphite-2:#3A3738;
  --red:#D32031;        /* фирменный красный логотипа */
  --red-hover:#E5384A; --red-press:#B51B2A;
  --on-dark:#F4F2F2; --on-dark-muted:#B3ADAE; --dark-line:rgba(255,255,255,.12);
  --bg:#FFFFFF; --surface:#F3F2F2; --text:#1B1A1A; --muted:#5E5A5B; --line:#E2DFDF;
  --accent-text:#B81B2B; --field:#FFFFFF; --error:#B81B2B; --ok:#1F6B45;
  --font-display:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --radius:3px; --hh:88px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141314; --surface:#1C1A1B; --text:#F1EFEF; --muted:#A8A2A3; --line:#322F30;
    --accent-text:#FF6470; --field:#191718; --error:#FF6470; --ok:#7BCFA2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141314; --surface:#1C1A1B; --text:#F1EFEF; --muted:#A8A2A3; --line:#322F30;
  --accent-text:#FF6470; --field:#191718; --error:#FF6470; --ok:#7BCFA2; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--brand);scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
img,svg{max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.005em}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1220px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.darkctx{background:var(--brand);color:var(--on-dark)}

/* ====== Шапка ====== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-dark);border-bottom:1px solid var(--dark-line);transition:box-shadow .25s}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:var(--hh);transition:height .25s}
.hdr.compact{--hh:68px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;flex-shrink:0;text-decoration:none}
.logo img{display:block;height:calc(var(--hh) - 16px);width:auto;transition:height .25s}
.nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav a,.nav .ddbtn{background:none;border:0;color:var(--on-dark);font:inherit;font-size:15px;font-weight:500;padding:10px 12px;text-decoration:none;cursor:pointer;border-radius:var(--radius);display:inline-flex;align-items:center;gap:6px}
.nav a:hover,.nav .ddbtn:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav a[aria-current="page"],.nav .ddbtn.cur{box-shadow:inset 0 -2px 0 var(--red)}
.dd{position:relative}
.ddbtn svg{width:14px;height:14px;transition:transform .2s}
.ddbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddmenu{position:absolute;top:calc(100% + 12px);left:-12px;min-width:330px;background:var(--black);border:1px solid var(--dark-line);border-top:2px solid var(--red);padding:8px;display:none;box-shadow:0 20px 44px rgba(0,0,0,.5)}
.ddmenu.open{display:block}
.ddmenu a{display:flex;width:100%;padding:11px 12px;gap:12px}
.ddmenu a:hover{background:var(--graphite)}
.ddmenu a[aria-current="page"]{box-shadow:inset 2px 0 0 var(--red)}
.ddmenu svg{width:20px;height:20px;stroke:var(--red);fill:none;stroke-width:1.6;flex-shrink:0}
.hdr-tools{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:var(--radius);overflow:hidden}
.lang button{background:none;border:0;color:var(--on-dark-muted);font:inherit;font-size:13px;font-weight:600;padding:6px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--on-dark);color:var(--brand)}
.burger{display:none;background:none;border:1px solid rgba(255,255,255,.22);color:var(--on-dark);width:44px;height:44px;border-radius:var(--radius);cursor:pointer;place-items:center}
.burger svg{width:22px;height:22px}
.mnav{display:none}

/* ====== Кнопки ====== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;font:inherit;font-size:16px;font-weight:600;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s;text-align:center}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-hover)}
.btn-red:active{background:var(--red-press)}
.btn-line{border-color:var(--line);color:var(--text);background:transparent}
.btn-line:hover{border-color:var(--text)}
.darkctx .btn-line{border-color:rgba(255,255,255,.3);color:var(--on-dark)}
.darkctx .btn-line:hover{border-color:#fff}
.btn-sm{padding:11px 18px;font-size:15px}

/* ====== Плашка прототипа ====== */
.proto{background:var(--graphite);color:#E9E6E6;font-size:13.5px}
.proto .wrap{display:flex;gap:10px;align-items:center;padding-top:8px;padding-bottom:8px}
.proto b{white-space:nowrap;color:#fff}

/* ====== Заглушки ====== */
.ph{border:1px dashed #8F898A;background:rgba(143,137,138,.12);color:var(--text);padding:0 6px;border-radius:3px;font-size:.94em}
.darkctx .ph{color:var(--on-dark);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.draft{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:16px;max-width:62ch}
.draft::before{content:"";flex:0 0 14px;height:14px;border:1px dashed #8F898A;margin-top:4px;border-radius:2px}

/* ====== Hero ====== */
.hero{padding:clamp(48px,7vw,104px) 0 clamp(56px,7vw,104px);overflow:hidden;position:relative}
.hero .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(2.3rem,4.9vw,4.5rem);line-height:1;margin:0 0 26px;max-width:17ch;overflow-wrap:break-word}
.hero p.sub{font-size:clamp(1.05rem,1.6vw,1.2rem);color:var(--on-dark-muted);max-width:50ch;margin:0 0 34px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.hero-art{margin:0}
.hero-art svg{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
main:focus{outline:none}
.hero-art figcaption{font-size:13px;color:var(--on-dark-muted);margin-top:10px}
.ridge-line{stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw 2.6s cubic-bezier(.3,.6,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.svc-strip{border-top:1px solid var(--dark-line);margin-top:clamp(44px,6vw,72px)}
.svc-strip ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr)}
.svc-strip a{display:flex;flex-direction:column;gap:10px;padding:22px 16px 4px 0;text-decoration:none;color:var(--on-dark-muted);font-size:14.5px;line-height:1.35}
.svc-strip a:hover{color:#fff}
.svc-strip svg{width:28px;height:28px;stroke:var(--red);fill:none;stroke-width:1.5}

/* ====== Секции ====== */
.section{padding:clamp(60px,8vw,112px) 0}
.section.alt{background:var(--surface)}
.section.black{background:var(--black);color:var(--on-dark)}
.shead{margin-bottom:clamp(32px,4vw,52px);max-width:760px}
.shead::before{content:"";display:block;width:40px;height:3px;background:var(--red);margin-bottom:22px}
.shead h2{font-size:clamp(2.1rem,4vw,3.3rem);line-height:1.02;margin:0 0 14px;overflow-wrap:break-word;-webkit-hyphens:manual;hyphens:manual}
.shead p{color:var(--muted);margin:0;max-width:60ch;font-size:1.06rem}
.darkctx .shead p,.black .shead p{color:var(--on-dark-muted)}

/* Услуги */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tile{display:flex;flex-direction:column;gap:14px;padding:30px 28px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:inherit;position:relative;transition:border-color .2s}
.tile::after{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--red);transform:scaleY(0);transform-origin:top;transition:transform .25s}
.tile:hover{border-color:var(--text)}
.tile:hover::after{transform:scaleY(1)}
.tile svg{width:44px;height:44px;stroke:var(--red);fill:none;stroke-width:1.4}
.tile h3{font-size:1.55rem;line-height:1.1;margin:4px 0 0}
.tile p{color:var(--muted);margin:0}
.tile .more{margin-top:auto;padding-top:8px;font-weight:600;color:var(--accent-text)}

/* Преимущества */
.adv{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,5vw,72px);align-items:start}
.adv .shead{margin-bottom:0}
.adv ul{list-style:none;margin:0;padding:0}
.adv li{display:grid;grid-template-columns:28px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}
.adv li:last-child{border-bottom:1px solid var(--line)}
.adv li svg{width:24px;height:24px;stroke:var(--red);fill:none;stroke-width:2;margin-top:3px}
.adv h3{font-family:var(--font-body);font-weight:600;font-size:1.1rem;margin:0 0 4px;letter-spacing:0}
.adv p{margin:0;color:var(--muted)}

/* Этапы */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.steps li{padding:30px 28px 34px 0;border-bottom:1px solid var(--line)}
.steps li:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--line)}
.steps .n{font-family:var(--font-display);font-weight:700;font-size:3.2rem;line-height:1;color:var(--red)}
.steps h3{font-family:var(--font-body);font-weight:600;font-size:1.12rem;margin:14px 0 6px;letter-spacing:0}
.steps p{margin:0;color:var(--muted)}

/* Фирменный блок */
.brandblock{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,72px);align-items:center}
.logo-panel{background:var(--brand);display:grid;place-items:center;padding:clamp(28px,5vw,56px);border-radius:var(--radius)}
.logo-panel img{display:block;width:auto;height:clamp(200px,28vw,320px)}
.brandblock .prose p{color:var(--muted)}

/* FAQ */
.faq{max-width:880px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 0;font-weight:600;font-size:1.08rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{flex:0 0 30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--accent-text);font-size:18px;transition:transform .2s,border-color .2s}
.faq details[open] .pm{transform:rotate(45deg);border-color:var(--red)}
.faq .ans{padding:0 48px 24px 0;color:var(--muted);max-width:70ch}
.faq .ans p{margin:0}

/* ====== Форма ====== */
.req{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(28px,5vw,64px);align-items:start}
.req-aside ol{list-style:none;padding:0;margin:24px 0 0}
.req-aside li{padding:13px 0;border-top:1px solid var(--line);display:flex;gap:14px;color:var(--muted)}
.req-aside li b{color:var(--red);min-width:1.2em;font-family:var(--font-display);font-size:1.35rem;line-height:1.15}
.card{background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:var(--radius);padding:clamp(22px,3.4vw,36px)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:12px 10px;font-weight:600;font-size:15px;line-height:1.3;color:var(--muted);height:100%}
.seg label+label span{border-left:1px solid var(--line)}
.seg input:checked+span{background:var(--red);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--text);outline-offset:-4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.field>label{font-weight:600;font-size:15px}
.field label small{font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;width:100%;min-height:48px}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text);outline:3px solid rgba(211,32,49,.18);outline-offset:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--error);border-width:2px}
.err{color:var(--error);font-size:13.5px;min-height:20px;font-weight:500}
.cnt{font-size:13px;color:var(--muted);text-align:right}
.consent{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;font-size:15px;margin-top:6px;font-weight:400}
.consent input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--red)}
.consent a{color:var(--accent-text)}
.field>label.consent{font-weight:400}
.demo-note{font-size:14px;color:var(--muted);background:var(--surface);border-left:3px solid var(--graphite-2);padding:12px 14px;margin:18px 0}
.form-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.result{border:1px solid var(--line);border-top:3px solid var(--ok);border-radius:var(--radius);padding:clamp(20px,3vw,32px);background:var(--bg)}
.result h3{font-size:1.8rem;margin:0 0 8px}
.result p{color:var(--muted);margin:0 0 16px}
.result .ok{color:var(--ok);font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:10px}
.result .ok svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.result pre{background:var(--surface);border:1px solid var(--line);padding:16px;overflow-x:auto;font-size:13px;line-height:1.5;margin:0 0 18px;border-radius:var(--radius)}

/* ====== Страница услуги ====== */
.crumbs{font-size:14px;color:var(--on-dark-muted);margin-bottom:22px}
.crumbs a{color:var(--on-dark-muted);text-decoration:none}
.crumbs a:hover{color:#fff}
.svc-hero{padding:clamp(40px,6vw,84px) 0}
.svc-hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:center}
.svc-hero h1{font-size:clamp(2.4rem,5.2vw,4.4rem);line-height:1;margin:0 0 20px}
.svc-hero p.sub{color:var(--on-dark-muted);font-size:1.12rem;max-width:52ch;margin:0 0 30px}
.vf{position:relative;aspect-ratio:4/3;background:linear-gradient(160deg,var(--graphite),var(--black));display:grid;place-items:center;text-align:center;padding:28px;color:var(--on-dark-muted);font-size:14px;border-radius:var(--radius)}
.vf .c{position:absolute;width:30px;height:30px;border:0 solid var(--red)}
.vf .tl{top:14px;left:14px;border-top-width:2px;border-left-width:2px}
.vf .tr{top:14px;right:14px;border-top-width:2px;border-right-width:2px}
.vf .bl{bottom:14px;left:14px;border-bottom-width:2px;border-left-width:2px}
.vf .br{bottom:14px;right:14px;border-bottom-width:2px;border-right-width:2px}
.vf svg{width:60px;height:60px;stroke:var(--red);fill:none;stroke-width:1.2;margin:0 auto 14px;display:block}
.vf.light{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.svc-body{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(28px,5vw,64px);align-items:start}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:grid;grid-template-columns:22px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.tasks li:last-child{border-bottom:1px solid var(--line)}
.tasks li::before{content:"";width:14px;height:3px;background:var(--red);margin-top:12px}
.aside-box{border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:20px;background:var(--bg)}
.aside-box h3{font-size:1.45rem;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:14.5px}
.plain{margin:0;padding-left:18px;color:var(--muted)}
.plain li{margin:6px 0}
.aside-box .btn{width:100%;margin-top:18px}
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.others a{display:flex;gap:12px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;background:var(--bg)}
.others a:hover{border-color:var(--text)}
.others svg{width:26px;height:26px;stroke:var(--red);fill:none;stroke-width:1.5;flex-shrink:0}

/* ====== Внутренние страницы ====== */
.page-hero{padding:clamp(44px,6vw,84px) 0 clamp(40px,5vw,68px)}
.page-hero .wrap.split{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(28px,5vw,64px);align-items:center}
.page-hero h1{font-size:clamp(2.4rem,5.2vw,4.4rem);line-height:1;margin:0 0 16px}
.page-hero p{color:var(--on-dark-muted);max-width:60ch;margin:0;font-size:1.1rem}
.page-hero .hero-logo{justify-self:center}
.page-hero .hero-logo img{display:block;height:clamp(180px,24vw,280px);width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:start}
.facts{margin:0}
.facts div{display:grid;grid-template-columns:minmax(140px,.8fr) 1.2fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.facts div:last-child{border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.prose{max-width:72ch}
.prose h2{font-size:1.8rem;margin:44px 0 12px}
.prose h2:first-child{margin-top:0}
.prose p,.prose li{color:var(--muted)}
.prose strong{color:var(--text)}
.contact-list{list-style:none;margin:0;padding:0}
.contact-list li{display:grid;grid-template-columns:28px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.contact-list li:last-child{border-bottom:1px solid var(--line)}
.contact-list svg{width:24px;height:24px;stroke:var(--red);fill:none;stroke-width:1.6;margin-top:3px}
.contact-list b{display:block;font-weight:600}
.addr-links{margin:8px 0 0;font-weight:600}
.addr-links a{color:var(--accent-text)}
.darkctx .addr-links a,footer .addr-links a{color:#F2545F}
.notice{border:1px dashed #8F898A;background:rgba(143,137,138,.1);padding:16px 18px;border-radius:var(--radius);color:var(--text);margin-bottom:32px;font-size:15px}

/* ====== Футер ====== */
.ftr{padding:60px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--red)}
.ftr .cols{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:32px}
.ftr .flogo img{display:block;height:150px;width:auto}
.ftr h3{font-family:var(--font-body);font-size:14px;font-weight:600;color:#fff;margin:0 0 14px;letter-spacing:0}
.ftr ul{list-style:none;margin:0;padding:0}
.ftr li{margin:8px 0;font-size:15px;color:var(--on-dark-muted)}
.ftr a{text-decoration:none;color:var(--on-dark-muted)}
.ftr a:hover{color:#fff}
.ftr .btn{margin-top:14px}
.ftr .bottom{margin-top:44px;padding-top:20px;border-top:1px solid var(--dark-line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--on-dark-muted)}

/* ====== Тост ====== */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--black);color:#fff;padding:14px 20px;border-radius:var(--radius);border-left:3px solid var(--red);font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ====== Адаптив ====== */
@media (max-width:1180px){
  :root{--hh:68px}
  .hdr.compact{--hh:68px}
  .nav,.hdr-tools .btn{display:none}
  .burger{display:grid}
  .hdr-tools{margin-left:auto}
  .mnav{display:block;position:fixed;left:0;right:0;top:calc(68px + env(safe-area-inset-top,0px));bottom:0;background:var(--brand);color:var(--on-dark);overflow-y:auto;z-index:19;padding:8px 0 calc(28px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s,transform .2s,visibility .2s}
  body.menu-open .mnav{opacity:1;visibility:visible;transform:none}
  body.menu-open{overflow:hidden}
  .mnav a{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--dark-line);text-decoration:none;font-size:18px}
  .mnav a[aria-current="page"]{color:#fff;box-shadow:inset 3px 0 0 var(--red);padding-left:12px}
  .mnav .sub a{font-size:16px;color:var(--on-dark-muted)}
  .mnav .sub svg{width:20px;height:20px;stroke:var(--red);fill:none;stroke-width:1.5}
  .mnav h3{font-family:var(--font-body);font-size:13px;color:var(--on-dark-muted);margin:22px 0 4px;font-weight:600;letter-spacing:0}
  .mnav .btn{width:100%;margin-top:12px}
  .mnav .btn:first-of-type{margin-top:26px}
  .svc-strip ul{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  .hero .hero-grid,.svc-hero .wrap,.adv,.req,.svc-body,.two,.brandblock,.page-hero .wrap.split,.ctrl,.theft,.svc-meta{grid-template-columns:1fr}
  .acards{grid-template-columns:1fr 1fr}
  .page-hero .hero-logo{justify-self:start}
  .steps{grid-template-columns:1fr 1fr}
  .steps li:not(:nth-child(3n+1)){padding-left:0;border-left:0}
  .steps li:nth-child(2n){padding-left:24px;border-left:1px solid var(--line)}
  .ftr .cols{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  body{font-size:16px}
  .grid2{grid-template-columns:1fr}
  .acards{grid-template-columns:1fr}
  .ladder li{grid-template-columns:48px 1fr;gap:16px}
  .ladder .node{width:48px;height:48px}
  .ladder li::before{left:23px;top:48px}
  .steps{grid-template-columns:1fr}
  .steps li:nth-child(2n){padding-left:0;border-left:0}
  .svc-strip ul{grid-template-columns:1fr 1fr}
  .ftr .cols{grid-template-columns:1fr}
  .cta-row .btn{flex:1 1 100%}
  .faq .ans{padding-right:0}
  .proto .wrap{font-size:12.5px}
  .facts div{grid-template-columns:1fr;gap:2px}
  .seg span{font-size:14px;padding:11px 6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .ridge-line{stroke-dashoffset:0}
}

/* ====== Преимущества: карточки ====== */
.acards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.acard{padding:30px 28px;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);display:flex;flex-direction:column;gap:12px}
.acard .ic{width:54px;height:54px;display:grid;place-items:center;background:rgba(211,32,49,.09);border-radius:var(--radius)}
.acard .ic svg{width:28px;height:28px;stroke:var(--red);fill:none;stroke-width:1.6}
.acard .big{font-family:var(--font-display);font-weight:700;font-size:3.4rem;line-height:54px;height:54px;color:var(--red);letter-spacing:-.02em}
.acard h3{font-size:1.4rem;line-height:1.15;margin:6px 0 0}
.acard p{margin:0;color:var(--muted)}

/* ====== Многоуровневый контроль ====== */
.ctrl{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,5vw,72px);align-items:start}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:grid;grid-template-columns:56px 1fr;gap:22px;padding-bottom:30px;position:relative}
.ladder li::before{content:"";position:absolute;left:27px;top:56px;bottom:0;width:2px;background:rgba(211,32,49,.5)}
.ladder li:last-child{padding-bottom:0}
.ladder li:last-child::before{display:none}
.ladder .node{width:56px;height:56px;border:2px solid var(--red);border-radius:50%;display:grid;place-items:center;background:var(--black)}
.ladder .node svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.6}
.ladder .lvl{font-size:13.5px;color:var(--on-dark-muted);padding-top:4px}
.ladder h3{font-family:var(--font-body);font-weight:600;font-size:1.15rem;margin:2px 0 6px;letter-spacing:0}
.ladder p{margin:0;color:var(--on-dark-muted)}

/* ====== Противодействие хищениям ====== */
.theft{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,72px);align-items:start}
.theft .statement{font-size:1.1rem;line-height:1.7;margin:0;border-left:3px solid var(--red);padding-left:22px}
.legal{display:grid;grid-template-columns:22px 1fr;gap:12px;margin-top:28px;padding:16px 18px;background:var(--surface);border-radius:var(--radius);color:var(--muted);font-size:14.5px}
.legal svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.7}
.process{list-style:none;margin:0;padding:0}
.process li{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.process li:last-child{border-bottom:1px solid var(--line)}
.process .pi{width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius)}
.process .pi svg{width:26px;height:26px;stroke:var(--red);fill:none;stroke-width:1.6}
.process h3{font-family:var(--font-body);font-weight:600;font-size:1.08rem;margin:2px 0 4px;letter-spacing:0}
.process p{margin:0;color:var(--muted)}
.process .num{color:var(--accent-text);font-weight:600;margin-right:6px}

/* ====== Подробная страница услуги ====== */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.svc-meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
.svc-meta .aside-box{margin:0}
.callout{border:1px solid var(--line);border-left:3px solid var(--red);padding:22px 24px;border-radius:var(--radius);background:var(--bg);margin-bottom:20px}
.callout h3{font-size:1.35rem;margin:0 0 8px}
.callout p{margin:0 0 14px;color:var(--muted)}

/* ====== Плашка перевода ====== */
.kzbar{background:var(--graphite);color:#ECE9E9;font-size:14.5px}
.kzbar .wrap{padding-top:12px;padding-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.hdr-phone{color:var(--on-dark);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;display:none}
.hdr-phone:hover{color:#fff;text-decoration:underline}
@media (min-width:1340px){.hdr-phone{display:inline}}
.hdr-call{display:none;width:44px;height:44px;border-radius:var(--radius);background:var(--red);color:#fff;place-items:center}
.hdr-call svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8}
@media (max-width:1180px){.hdr-call{display:grid}}
.forg{margin-top:18px}
.forg p{margin:0 0 6px;font-size:14px;color:var(--on-dark-muted);max-width:34ch}
.ftr li a{word-break:break-word}
.clink{color:var(--text);font-weight:600;text-decoration:none;font-size:1.1rem}
.clink:hover{color:var(--accent-text);text-decoration:underline}
.contact-btns .btn svg{width:18px;height:18px}
.req-card{background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:var(--radius);padding:clamp(20px,3vw,34px);max-width:900px}
.req-card dd{overflow-wrap:anywhere}
.req-card a{color:var(--accent-text)}
.mcontact{margin-top:18px;padding-top:18px;border-top:1px solid var(--dark-line)}
.mcontact .btn{width:100%;margin-top:10px}
.mcontact .btn-line{border-color:rgba(255,255,255,.3);color:var(--on-dark)}
.mnav .mcontact a.btn{padding:14px 20px;font-size:16px;justify-content:center;border:1px solid transparent}
.mnav .mcontact a.btn-line{border-color:rgba(255,255,255,.3)}
@media (max-width:600px){.contact-btns .btn{flex:1 1 100%}}
.kzbar svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7;flex-shrink:0;margin-top:2px}
.dgrid .acard.wide{grid-column:1/-1;display:grid;grid-template-columns:54px 1fr;column-gap:22px;row-gap:6px;align-items:start}
.dgrid .acard.wide .ic{grid-row:1/3}
.dgrid .acard.wide h3{margin:0}
.dgrid .acard.wide p{max-width:70ch}
/* адаптив новых блоков (после базовых правил) */
@media (max-width:900px){
  .ctrl,.theft,.svc-meta{grid-template-columns:1fr}
  .acards{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .acards{grid-template-columns:1fr}
  .ladder li{grid-template-columns:48px 1fr;gap:16px}
  .ladder .node{width:48px;height:48px}
  .ladder li::before{left:23px;top:48px}
  .dgrid .acard.wide{grid-template-columns:1fr}
  .dgrid .acard.wide .ic{grid-row:auto}
  .hero h1{font-size:clamp(1.9rem,8.4vw,2.3rem)}
  .shead h2{font-size:clamp(1.75rem,7.6vw,2.1rem)}
  .page-hero h1,.svc-hero h1{font-size:clamp(1.9rem,8.6vw,2.4rem)}
}
/* без автопереносов: Safari иначе рвёт «без-опасность»; слово переносится, только если не влезает целиком */
h1,h2,h3{overflow-wrap:break-word;-webkit-hyphens:manual;hyphens:manual}
/* ====== 3D: главный экран ====== */
.hero{padding:0}
.hero-top{position:relative;min-height:560px;min-height:clamp(540px,calc(100svh - var(--hh) - 40px),860px);display:flex;align-items:center;overflow:hidden}
.hero-stage{position:absolute;inset:0;background:#1a1720}
.hero-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .9s}
.hero-stage.live canvas{opacity:1}
.hero-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(16px,4vw,40px);background:var(--brand);transition:opacity .6s,visibility .6s}
.hero-fallback .hero-art{width:min(46%,560px)}
.hero-stage.live .hero-fallback{opacity:0;visibility:hidden}
.hero-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(14,12,16,.84) 0%,rgba(14,12,16,.56) 34%,rgba(14,12,16,0) 62%),linear-gradient(0deg,rgba(14,12,16,.78) 0%,rgba(14,12,16,0) 34%)}
.hero-copy{position:relative;width:100%;padding:clamp(48px,7vw,96px) 0 clamp(88px,9vw,112px);pointer-events:none}
.hero-text{max-width:640px;pointer-events:auto}
.hero-text h1{text-shadow:0 2px 24px rgba(0,0,0,.45)}
.hero-text p.sub{color:#E4DFDF;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.hero-cap{position:absolute;left:clamp(16px,4vw,40px);bottom:clamp(16px,2.4vw,26px);margin:0;max-width:42ch;font-size:13px;color:var(--on-dark-muted);display:none;pointer-events:none}
.hero-stage.live .hero-cap{display:block}
.hero-ctrl{position:absolute;z-index:2;right:clamp(12px,3vw,32px);bottom:clamp(14px,2.4vw,24px);display:none;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:calc(100% - 24px)}
.hero-stage.live .hero-ctrl{display:flex}
.chip3d{background:rgba(22,21,22,.72);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:var(--radius);padding:9px 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip3d:hover{border-color:#fff}
.chip3d[aria-pressed="true"]{background:#fff;color:var(--brand)}
.hero .hero-svc{position:relative;padding-bottom:clamp(28px,4vw,48px)}
.hero .svc-strip{margin-top:0}
@media (max-width:1000px){.hero-cap{display:none!important}}
@media (max-width:700px){
  .hero-top{min-height:calc(100svh - var(--hh) - 60px);align-items:flex-end}
  .hero-shade{background:linear-gradient(0deg,rgba(14,12,16,.94) 0%,rgba(14,12,16,.74) 48%,rgba(14,12,16,.1) 80%)}
  .hero-fallback{align-items:flex-start;justify-content:center;padding-top:20px}
  .hero-fallback .hero-art{width:100%;opacity:.5}
  .hero-fallback figcaption{display:none}
  .hero-copy{padding:150px 0 40px}
  .hero-ctrl{left:12px;right:12px;top:12px;bottom:auto;justify-content:flex-start}
  .chip3d{padding:8px 10px;font-size:13px}
}

/* ====== 3D: эмблема ====== */
.emblem{display:flex;flex-direction:column;align-items:center;width:100%;--eh:clamp(220px,26vw,330px)}
.hero-logo .emblem{width:min(100%,380px);--eh:clamp(200px,22vw,280px)}
.emblem-stage{position:relative;width:100%;height:var(--eh);display:none;cursor:grab;touch-action:pan-y}
.emblem-stage:active{cursor:grabbing}
.emblem-stage canvas{display:block;width:100%;height:100%}
.emblem.live .emblem-stage{display:block}
.emblem.live .emblem-fallback{display:none}
.emblem img.word{display:none}
.logo-panel .emblem img.word,.hero-logo .emblem img.word{width:min(300px,72%);height:auto;margin-top:4px}
.emblem.live img.word{display:block}
.emblem p.emblem-hint{display:none;margin:14px 0 0;font-size:13px;color:var(--on-dark-muted);text-align:center;max-width:none}
.emblem.live p.emblem-hint{display:block}
.logo-panel:has(.emblem.live){padding-top:clamp(12px,2vw,24px)}

/* ====== Карта охраны ====== */
.mapsec{background:#121113}
.mapview{position:relative;height:calc(100svh - var(--hh) - 40px);min-height:560px;max-height:1000px;overflow:hidden;background:#17161a;color:#fff;font-family:var(--font-body);-webkit-user-select:none;user-select:none}
.map-host{position:absolute;inset:0}
.map-host canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.map-svg{position:absolute;inset:0;display:none}
.mapview[data-engine="svg"] .map-svg{display:block}
.mapview[data-engine="svg"] .map-labels{display:none}
.msvg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;--g:#D5D1C6;--b:#ECE9E2;--bl:#CFC9BE;--tl:#B9B3A7;--pk:#B9CCA6;--rd:#FFFFFF;--mj:#FFE7A8;--lm:#E7C7CB;--mt:#BDB09C;--ou:#DCD8CE}
.msvg:active{cursor:grabbing}
.svg-night .msvg{--g:#1C1B1E;--b:#27262A;--bl:#333137;--tl:#3E3B42;--pk:#22301F;--rd:#4A494E;--mj:#7A6A44;--lm:#5A2A30;--mt:#2C2724;--ou:#232226}
.sg-ground{fill:var(--g)} .sg-mount{fill:var(--mt)} .sg-outer{fill:var(--ou)} .sg-block{fill:var(--b)} .sg-park{fill:var(--pk)}
.sg-road{fill:var(--rd)} .sg-major{fill:var(--mj)} .sg-bld{fill:var(--bl)} .sg-tall{fill:var(--tl)} .sg-lm{fill:var(--lm)}
.smk{cursor:pointer;outline:none}
.smk-halo{fill:rgba(211,32,49,.25)} .smk-dot{fill:#D32031;stroke:#fff;stroke-width:2} .smk svg path{fill:#fff}
.smk.on .smk-halo,.smk:focus-visible .smk-halo{fill:rgba(211,32,49,.5);stroke:#fff;stroke-width:2}
.scar{cursor:pointer;outline:none} .scar-halo{fill:rgba(255,255,255,.18)} .scar-dot{fill:#fff;stroke:#D32031;stroke-width:1.6}
.scar.on .scar-halo,.scar:focus-visible .scar-halo{fill:rgba(211,32,49,.45)}

/* метки объектов над 3D-картой */
.map-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;transition:opacity .4s}
.mk{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 7px;background:rgba(16,15,17,.86);color:#fff;border:0;border-left:3px solid var(--red);border-radius:3px;font:600 13px/1.1 var(--font-body);white-space:nowrap;cursor:pointer;pointer-events:auto;will-change:transform}
.mk:hover,.mk.on{background:var(--red);border-left-color:#fff}
.mk-ic svg{display:block;width:13px;height:15px;fill:var(--red)}
.mk:hover .mk-ic svg,.mk.on .mk-ic svg{fill:#fff}
.mk.far .mk-tx{display:none}
.mk.far{padding:6px 7px}
.mk.occl{visibility:hidden}
.mk-car{cursor:default;border-left-color:#fff}
.mk.dg{position:relative;transform:translate(-50%,-100%)}
.dg-hide-mk .mk.dg{opacity:0;transform:translate(-50%,-80%)}
.mk.dg{transition:opacity .5s,transform .5s}
.dgcar{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--red);box-shadow:0 0 0 6px rgba(211,32,49,.25);transform:translate(-50%,-50%);cursor:pointer;padding:0}
.dgcar.on{box-shadow:0 0 0 9px rgba(211,32,49,.5)}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
.hud>*{pointer-events:auto}
.hpanel{background:rgba(17,16,18,.82);border:1px solid rgba(255,255,255,.1);border-radius:3px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hud-tl{position:absolute;left:16px;top:16px;width:236px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud-tl>*{pointer-events:auto}
.hud-title{display:flex;gap:11px;align-items:center;padding:11px 13px;border-left:3px solid var(--red)}
.hud-em svg{display:block;width:26px;height:30px;fill:var(--red)}
.hud-title h1{font-family:var(--font-display);font-size:1.22rem;line-height:1.05;margin:0;letter-spacing:0;color:#fff}
.hud-title p{margin:3px 0 0;font-size:12.5px;line-height:1.3;color:var(--on-dark-muted)}
.hud-filters{display:flex;flex-direction:column;gap:4px}
.fchip{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;background:rgba(17,16,18,.82);color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:3px;font:500 14px/1.2 var(--font-body);cursor:pointer;text-align:left;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fchip svg{width:18px;height:18px;flex-shrink:0;stroke:var(--red);fill:none;stroke-width:1.7}
.fchip:hover{border-color:rgba(255,255,255,.4)}

async function copyRequisites(){
  const text = reqRows().map(r => `${r[0]}: ${r[1]}`).join('\n');
  try { await navigator.clipboard.writeText(text); toast(t('copied')); }
  catch(e){
    try {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
      toast(t(ok ? 'copied' : 'copyFail'));
    } catch(e2){ toast(t('copyFail')); }
  }
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

const app = document.getElementById('app');
let pending = null;

function currentRoute(){
  /* «#contacts/адрес» — страница контактов с выбранным адресом на карте */
  const [tk, sub] = (decodeURIComponent(location.hash.replace(/^#/, '')) || 'home').split('/');
  if (VIEWS[tk] && tk !== 'service') return { key:tk, sub };
  const s = svcById(tk);
  return s ? { key:'service', svc:s } : { key:'home' };
}
const pageTitle = r => r.svc ? L(r.svc.title) : ({ home:t('titleHome'), map:t('mapTitle'), about:t('navAbout'), contacts:t('navContacts'), privacy:t('navPrivacy') })[r.key];

function render(keepScroll=false){
  const r = currentRoute();
  const y = window.scrollY;
  GMAP.unmount();
  renderedKey = r.key;
  app.innerHTML =r.key === 'service' ? VIEWS.service(r.svc) : VIEWS[r.key]();
  document.title = `${pageTitle(r)} — ALAMIR SECURITY`;
  const navKey = r.key === 'service' ? 'services' : r.key;
  document.querySelectorAll('[data-nav]').forEach(el => {
    const on = el.dataset.nav === navKey;
    if (el.tagName === 'A') on ? el.setAttribute('aria-current','page') : el.removeAttribute('aria-current');
    else el.classList.toggle('cur', on);
  });
  const here = '#' + (r.svc ? r.svc.id : r.key);
  document.querySelectorAll('.ddmenu a, .mnav a').forEach(a => a.getAttribute('href') === here ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  closeMenus();
  bindForm();
  mount3D();
  GMAP.mount(r.sub);
  if (keepScroll){ window.scrollTo(0, y); return; }
  if (r.sub && GMAP.has(r.sub)){ requestAnimationFrame(() => scrollToId('gta-sec')); return; }
  if (pending){
    const p = pending; pending = null;
    requestAnimationFrame(() => p.scroll === 'request' ? goToForm(p.svc, p.kind) : scrollToId(p.scroll));
  } else {
    window.scrollTo(0,0);
    app.focus({ preventScroll:true });
  }
}

const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function scrollToId(id){ const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth' }); }

function goToForm(svc, kind){
  const f = document.getElementById('request-form');
  if (f){
    if (svc) f.elements.objectType.value = svc;
    if (kind) { const r = f.querySelector(`input[name="requestType"][value="${kind}"]`); if (r) r.checked = true; }
  }
  scrollToId('request');
  if (f) setTimeout(() => f.elements.name.focus({ preventScroll:true }), 450);
}

function navigateAndScroll(target, svc, kind){
  const onHome = currentRoute().key === 'home';
  if (target === 'request' && document.getElementById('request-form')) return goToForm(svc, kind);
  if (target !== 'request' && onHome && document.getElementById(target)) return scrollToId(target);
  pending = { scroll:target, svc, kind };
  if (location.hash === '#home' || (!location.hash && onHome)) render(); else location.hash = 'home';
}

function formatPhone(v){
  let d = v.replace(/\D/g, '');
  if (!d) return '';
  if (d[0] === '8') d = '7' + d.slice(1);
  if (d[0] !== '7') d = '7' + d;
  d = d.slice(0, 11);
  const p = d.slice(1);
  let out = '+7';
  if (p.length) out += ' (' + p.slice(0,3);
  if (p.length > 3) out += ') ' + p.slice(3,6);
  if (p.length > 6) out += '-' + p.slice(6,8);
  if (p.length > 8) out += '-' + p.slice(8,10);
  return out;
}
const NAME_RE = /^[A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі\s'’-]+$/;

function validate(f){
  const v = n => (f.elements[n].value || '').trim();
  const E = F.e, e = {};
  const name = v('name');
  if (!name) e.name = L(E.nameEmpty);
  else if (name.length < 2) e.name = L(E.nameShort);
  else if (!NAME_RE.test(name)) e.name = L(E.nameBad);
  const digits = v('phone').replace(/\D/g, '');
  if (!digits || digits === '7') e.phone = L(E.phoneEmpty);
  else if (digits.length !== 11 || digits[1] !== '7') e.phone = L(E.phoneBad);
  if (!v('objectType')) e.objectType = L(E.type);
  const addr = v('address');
  if (!addr) e.address = L(E.addressEmpty);
  else if (addr.length < 3) e.address = L(E.addressShort);
  if (!v('posts')) e.posts = L(E.posts);
  if (!v('schedule')) e.schedule = L(E.schedule);
  if (v('comment').length > 1000) e.comment = L(E.comment);
  if (!f.elements.consent.checked) e.consent = L(E.consent);
  return e;
}
const ERR_IDS = { name:'e-name', phone:'e-phone', objectType:'e-type', address:'e-address', posts:'e-posts', schedule:'e-schedule', comment:'e-comment', consent:'e-consent' };

function showErrors(f, errs){
  Object.entries(ERR_IDS).forEach(([field, id]) => {
    const box = document.getElementById(id); const el = f.elements[field];
    const msg = errs[field] || '';
    box.textContent = msg;
    el.setAttribute('aria-invalid', msg ? 'true' : 'false');
    el.closest('.field').classList.toggle('invalid', !!msg);
  });
}

function bindForm(){
  const f = document.getElementById('request-form');
  if (!f) return;
  let tried = false;
  const phone = f.elements.phone;
  phone.addEventListener('focus', () => { if (!phone.value) phone.value = '+7 ('; });
  phone.addEventListener('blur', () => { if (phone.value.replace(/\D/g,'') === '7') phone.value = ''; });
  phone.addEventListener('paste', ev => {
    const d = (ev.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    if (d.length === 10) { ev.preventDefault(); phone.value = formatPhone('7' + d); phone.dispatchEvent(new Event('input', { bubbles:true })); }
  });
  phone.addEventListener('input', () => { phone.value = formatPhone(phone.value); });
  const c = f.elements.comment, cnt = document.getElementById('c-comment');
  c.addEventListener('input', () => { cnt.textContent = `${c.value.length} / 1000`; });
  f.addEventListener('input', () => { if (tried) showErrors(f, validate(f)); });
  f.addEventListener('change', () => { if (tried) showErrors(f, validate(f)); });
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    tried = true;
    const errs = validate(f);
    showErrors(f, errs);
    const first = Object.keys(ERR_IDS).find(k => errs[k]);
    if (first){ f.elements[first].focus(); return; }
    showResult(f);
  });
}

function showResult(f){
  const g = n => (f.elements[n].value || '').trim();
  const lbl = (list, key) => { const x = list.find(i => i[0] === key); return x ? x[1].ru : key; };
  const svc = svcById(g('objectType'));
  const kind = (f.querySelector('input[name="requestType"]:checked') || {}).value || 'guard';
  // Структура заявки для будущей передачи в CRM / n8n (сейчас нигде не сохраняется)
  const lead = {
    source: 'website',
    created_at: new Date().toISOString(),
    lang: LANG,
    request_type: kind,
    request_type_label: lbl(KINDS, kind),
    name: g('name'),
    phone: '+' + g('phone').replace(/\D/g, ''),
    object_type: g('objectType'),
    object_type_label: svc ? svc.menu.ru : 'Другой объект',
    address: g('address'),
    posts: g('posts'),
    posts_label: lbl(POSTS, g('posts')),
    schedule: g('schedule'),
    schedule_label: lbl(SCHEDULES, g('schedule')),
    comment: g('comment') || null,
    consent: true
  };
  const slot = document.getElementById('form-slot');
  slot.innerHTML = `
<div class="result" tabindex="-1" id="result">
  <div class="ok">${icon('check')}${L(F.okTitle)}</div>
  <h3>${L(F.okH)}</h3>
  <p>${L(F.okP)}</p>
  <pre><code id="lead-json"></code></pre>
  <button class="btn btn-line" type="button" id="again">${L(F.again)}</button>
</div>`;
  document.getElementById('lead-json').textContent = JSON.stringify(lead, null, 2);
  const r = document.getElementById('result'); r.focus({ preventScroll:true }); r.scrollIntoView({ block:'nearest' });
  document.getElementById('again').addEventListener('click', () => {
    slot.innerHTML = formInner(lead.object_type, lead.request_type);
    bindForm();
    document.getElementById('request-form').elements.name.focus();
  });
}

function detectLight(){
  try{
    const coarse = matchMedia('(pointer:coarse)').matches;
    const cores = navigator.hardwareConcurrency || 8, mem = navigator.deviceMemory || 8;
    return coarse || cores <= 4 || mem <= 4;
  }catch(e){ return false; }
}

const S3 = { status:'idle', light:detectLight(), stages:{}, failed:{} };
const STAGES = [];

function makeStage(key, opts={}){
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:!!opts.alpha, powerPreference:'high-performance' });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure || 1;
  if (opts.alpha) renderer.setClearColor(0x000000, 0);
  const st = { key, host:null, renderer, scene:null, camera:null, visible:false, ready:false, update:()=>{}, applyQuality:()=>{} };
  st.resize = () => {
    const h = st.host; if (!h) return;
    const w = h.clientWidth, hh = h.clientHeight; if (!w || !hh) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, S3.light ? 1 : 1.75));
    renderer.setSize(w, hh, false);
    if (st.camera){ st.camera.aspect = w / hh; st.camera.updateProjectionMatrix(); }
  };
  const ro = new ResizeObserver(() => st.resize());
  const io = new IntersectionObserver(es => { st.visible = es[es.length-1].isIntersecting; }, { rootMargin:'120px' });
  st.attach = host => {
    if (st.host === host) return;
    st.detach();
    st.host = host;
    host.prepend(renderer.domElement);
    ro.observe(host); io.observe(host);
    st.resize();
  };
  st.detach = () => {
    if (!st.host) return;
    ro.disconnect(); io.disconnect();
    renderer.domElement.remove();
    st.host = null; st.visible = false;
  };
  STAGES.push(st);
  return st;
}

function makeSky(top, mid, hor, radius){
  const mat = new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ top:{value:new THREE.Color(top)}, mid:{value:new THREE.Color(mid)}, hor:{value:new THREE.Color(hor)} },
    vertexShader:'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader:'uniform vec3 top; uniform vec3 mid; uniform vec3 hor; varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 c = h < 0.0 ? hor : (h < 0.14 ? mix(hor, mid, h / 0.14) : mix(mid, top, clamp((h - 0.14) / 0.55, 0.0, 1.0))); gl_FragColor = vec4(c, 1.0); }'
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), mat);
  sky.renderOrder = -1; sky.frustumCulled = false;

}

}

function buildLogo(host){

    s.h.forEach(h => sh.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))));
    return sh;
  });
  const geo = new THREE.ExtrudeGeometry(shapes, { depth:.2, bevelEnabled:true, bevelThickness:.03, bevelSize:.011, bevelSegments:4, curveSegments:2 });
  geo.center();
  const mat = new THREE.MeshPhysicalMaterial({ color:col('#D32031'), metalness:.6, roughness:.3, clearcoat:.85, clearcoatRoughness:.14, envMapIntensity:1.05 });
  const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2.5, 3, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(col('#FF8A8A'), .9); rim.position.set(-3, 1, -3); scene.add(rim);

  const controls = new THREE.OrbitControls(cam, R.domElement);
  R.domElement.style.touchAction = 'pan-y';
  Object.assign(controls, { enableZoom:false, enablePan:false, enableDamping:true, dampingFactor:.08, autoRotate:!RM3D, autoRotateSpeed:1.5, minPolarAngle:1.0, maxPolarAngle:2.15 });
  let resumeTimer, rotating = !RM3D;
  controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
  controls.addEventListener('end', () => { clearTimeout(resumeTimer); resumeTimer = setTimeout(() => { controls.autoRotate = rotating; }, 2500); });
  st.setRotate = v => { rotating = v; controls.autoRotate = v; };
  st.reset = () => { controls.reset(); cam.position.set(0,0,6.6); controls.target.set(0,0,0); controls.update(); };
  st.update = () => { controls.update(); };
  st.applyQuality = () => st.resize();
  st.attach(host);
  st.ready = true;
  return st;
}

/* монтирование сцен после каждой отрисовки страницы (роутер и смена языка) */
function mount3D(){ mount3Dcore(); MAPC.mount(); }
function mount3Dcore(){
  const hosts = [...app.querySelectorAll('[data-scene]')];
  Object.values(S3.stages).forEach(st => { if (!hosts.some(h => h.dataset.scene === st.key)) st.detach(); });
  if (!hosts.length || S3.status === 'failed') return;
  if (S3.status !== 'ready'){ load3D(); return; }
  hosts.forEach(h => {
    const key = h.dataset.scene;
    if (S3.failed[key]) return;
    const live = key === 'emblem' ? h.closest('.emblem') : h;
    live.classList.add('live');
    try {
      if (S3.stages[key]) S3.stages[key].attach(h);
      else S3.stages[key] = BUILDERS[key](h);
      const cv = S3.stages[key].renderer.domElement;
      cv.setAttribute('role', 'img');
      cv.setAttribute('aria-label', t(key === 'hero' ? 's3Hero' : 's3Emblem'));
    } catch(e){
      console.error(e); S3.failed[key] = true; live.classList.remove('live');
      if (S3.stages[key]) S3.stages[key].detach();
    }
  });
  syncCtrl();
}

function syncCtrl(){
  const hero = S3.stages.hero;
  const set = (k, v) => { const b = app.querySelector(`[data-h3d="${k}"]`); if (b) b.setAttribute('aria-pressed', String(!!v)); };
  set('pause', hero && hero.paused); set('free', hero && hero.free); set('light', S3.light);
}

function setQuality(light, msg){
  S3.light = light;
  STAGES.forEach(s => { try { s.applyQuality(); } catch(e){ console.error(e); } });
  syncCtrl();
  if (msg) toast(msg);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-h3d]'); if (!b) return;
  const hero = S3.stages.hero, act = b.dataset.h3d;
  if (act === 'pause' && hero) hero.setPaused(!hero.paused);
  if (act === 'free' && hero){ hero.setFree(!hero.free); if (hero.free) toast(t('s3FreeToast')); }
  if (act === 'light') setQuality(!S3.light);
  syncCtrl();
});

const THREE_SRC = [
  'https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js',
  'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js'
];
const loadScript = src => new Promise((res, rej) => {
  const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Не загрузился ' + src));
  document.head.appendChild(s);
});
function load3D(){
  if (S3.status !== 'idle') return;
  if (!webglOK()){ S3.status = 'failed'; return; }
  S3.status = 'loading';
  THREE_SRC.reduce((p, src) => p.then(() => loadScript(src)), Promise.resolve())
    .then(() => {
      if (!window.THREE || !THREE.OrbitControls || !THREE.RoomEnvironment) throw new Error('Three.js загрузился не полностью');
      UNIT_BOX = new THREE.BoxGeometry(1,1,1);
      _UP = new THREE.Vector3(0,1,0);
      S3.status = 'ready';
      mount3D();
      requestAnimationFrame(loop3D);
    })
    .catch(e => { console.error(e); S3.status = 'failed'; MAPC.mount(); });
}

/* общий цикл: рисуются только сцены на экране; на слабых устройствах — облегчённый режим */
let last3D = performance.now(), fpsAcc = 0, fpsN = 0, fpsWarm = 0, fpsChecked = false;
function loop3D(now){
  requestAnimationFrame(loop3D);
  const dt = Math.min(.05, (now - last3D)/1000); last3D = now;
  if (document.hidden) return;
  for (const s of STAGES){
    if (!s.host || !s.visible || !s.ready) continue;
    try { s.update(dt, now/1000); s.renderer.render(s.scene, s.camera); } catch(e){ console.error(e); s.ready = false; if (s.key === 'map'){ S3.failed.map = true; s.detach(); MAPC.introDone(); MAPC.engine = null; MAPC.mount(); } }
  }
  const hero = [S3.stages.map, S3.stages.hero].find(s => s && s.host && s.visible);
  if (!fpsChecked && !S3.light && hero){
    if (++fpsWarm > 90){
      fpsAcc += dt; fpsN++;
      if (fpsAcc > 4){ fpsChecked = true; if (fpsN/fpsAcc < 28) setQuality(true, t('s3LightToast')); }
    }
  }
}

/* ---------- схема города (чистые данные, без Three.js) ---------- */
let CITY = null;
function makeCity(){
  const r = rng(77);
  const xs = [], zs = [];
  for (let x = -1700; x <= 1720; x += 220 + Math.floor(r()*4)*30) xs.push(x);
  for (let z = -1400; z <= 1420; z += 200 + Math.floor(r()*4)*30) zs.push(z);
  const xw = xs.map((_,i) => i % 3 === 1 ? 30 : 18), zw = zs.map((_,j) => j % 3 === 1 ? 30 : 18);
  const X0 = xs[0], X1 = xs[xs.length-1], Z0 = zs[0], Z1 = zs[zs.length-1];
  const roads = [];
  xs.forEach((x,i) => roads.push({ x0:x, z0:Z0, x1:x, z1:Z1, w:xw[i], major:xw[i] > 20, ns:true }));
  zs.forEach((z,j) => roads.push({ x0:X0, z0:z, x1:X1, z1:z, w:zw[j], major:zw[j] > 20, ns:false }));

  const nodes = [], NX = xs.length;
  for (let j=0;j<zs.length;j++) for (let i=0;i<NX;i++) nodes.push({ i, j, x:xs[i], z:zs[j], R:Math.max(xw[i], zw[j])/2 + 3, nb:[] });
  const link = (a, b, w) => { nodes[a].nb.push({ to:b, w }); nodes[b].nb.push({ to:a, w }); };
  for (let j=0;j<zs.length;j++) for (let i=0;i<NX;i++){
    const id = j*NX + i;
    if (i < NX-1) link(id, id+1, zw[j]);
    if (j < zs.length-1) link(id, id+NX, xw[i]);
  }

  const blocks = [];
  for (let i=0;i<NX-1;i++) for (let j=0;j<zs.length-1;j++){
    const x0 = xs[i] + xw[i]/2, x1 = xs[i+1] - xw[i+1]/2, z0 = zs[j] + zw[j]/2, z1 = zs[j+1] - zw[j+1]/2;
    blocks.push({ i, j, x0, x1, z0, z1, cx:(x0+x1)/2, cz:(z0+z1)/2, w:x1-x0, d:z1-z0, kind:'city' });
  }
  MAP_OBJECTS.forEach(o => {
    let best = null, bd = 1e9;
    blocks.forEach(b => { if (b.kind !== 'city') return; const dd = Math.hypot(b.cx - o.at[0], b.cz - o.at[1]); if (dd < bd){ bd = dd; best = b; } });
    best.kind = 'landmark'; best.obj = o; o.x = best.cx; o.z = best.cz; o.block = best;
    o.lm = landmark(o, best);
  });
  blocks.forEach(b => { if (b.kind === 'city' && r() < .09) b.kind = 'park'; });

  const PAL = ['#F2EEE6','#E7E1D6','#DCE1E6','#D2D9DF','#EFE8DA','#C9D1D8','#F5F1EA','#E3D9CB'];
  const blds = [], trees = [];
  blocks.forEach(b => {
    const m = 9;
    if (b.kind === 'park'){
      for (let n=0;n<26;n++) trees.push({ x:b.x0 + m + r()*(b.w-2*m), z:b.z0 + m + r()*(b.d-2*m), s:.8 + r()*.6 });
      return;
    }
    if (b.kind === 'landmark') return;
    const nx = Math.max(1, Math.min(4, Math.round(b.w/75))), nz = Math.max(1, Math.min(4, Math.round(b.d/75)));
    const pw = (b.w - m*2)/nx, pd = (b.d - m*2)/nz;
    for (let a=0;a<nx;a++) for (let c=0;c<nz;c++){
      if (r() < .1) continue;
      const w = pw*(.55 + r()*.35), d = pd*(.55 + r()*.35);
      const x = b.x0 + m + pw*(a+.5) + (r()-.5)*(pw-w)*.8, z = b.z0 + m + pd*(c+.5) + (r()-.5)*(pd-d)*.8;
      const dc = Math.hypot(x - 380, z - 520);
      const h = (dc < 650 && r() < .55) ? 45 + r()*r()*150 : 10 + r()*r()*36 + (r() < .3 ? 12 : 0);
      blds.push({ x, z, w, d, h, c:PAL[Math.floor(r()*PAL.length)], u:r()*8 });
    }
    for (let n=0;n<6;n++) trees.push({ x:b.x0 + 4, z:b.z0 + 14 + n*(b.d-28)/5, s:.6 });
  });
  const outer = [];
  for (let k=0;k<520;k++){
    const x = (r()-.5)*9400, z = -4800 + r()*6400;
    if (x > X0-160 && x < X1+160 && z > Z0-160 && z < Z1+160) continue;
    outer.push({ x, z, w:14 + r()*30, d:14 + r()*30, h:6 + r()*r()*34 });
  }
  return { xs, zs, xw, zw, roads, nodes, blocks, blds, trees, outer, X0, X1, Z0, Z1 };
}

/* силуэт объекта на своём квартале: коробки (glass — с окнами), трубы, стройка */
function landmark(o, b){
  const x = b.cx, z = b.cz, out = { boxes:[], chimneys:[], site:false, top:30 };
  const B = (dx, dz, w, d, h, kind='glass', c='#DCE3EA') => out.boxes.push({ x:x+dx, z:z+dz, w, d, h, kind, c, u:0 });
  switch (o.cat){
    case 'bc': B(0, 0, 90, 70, 18, 'glass', '#D8DEE4'); B(0, -6, 46, 46, 190, 'glass', '#BFD0DE'); break;
    case 'construction': B(-50, 40, 60, 30, 4, 'plain', '#6E6A64'); out.site = true; break;
    case 'industrial': B(-20, 10, 140, 80, 22, 'plain', '#9AA0A6'); B(60, -50, 70, 50, 16, 'plain', '#8C8F93'); B(-70, -55, 40, 30, 12, 'glass', '#D2D0CB');
      out.chimneys.push({ x:x+40, z:z+30, r:4, h:70 }, { x:x+55, z:z+30, r:3.5, h:58 }); break;
    case 'warehouse': [-50, 0, 50].forEach(dz => B(0, dz, Math.min(170, b.w-30), 38, 14, 'plain', '#B9B4AA')); break;
    case 'retail': B(0, 0, Math.min(170, b.w-24), Math.min(120, b.d-24), 26, 'glass', '#E2DDD4'); B(0, 0, 60, 60, 36, 'glass', '#C6D3DD'); break;
    case 'residential': B(0, 0, Math.min(160, b.w-30), Math.min(120, b.d-30), 8, 'glass', '#E9E3D8');
      [[-45,-35,70],[45,-35,82],[-45,35,64],[45,35,76]].forEach(p => B(p[0], p[1], 32, 32, p[2], 'glass', '#EFE9DF')); break;
  }
  out.top = Math.max(30, ...out.boxes.map(q => q.h), ...out.chimneys.map(q => q.h), out.site ? 70 : 0);
  return out;
}

/* ---------- движение по дорогам: правая полоса, плавные повороты ---------- */
function edgePts(C, a, b, w){
  const A = C.nodes[a], B = C.nodes[b], dx = B.x - A.x, dz = B.z - A.z, L = Math.hypot(dx, dz);
  const d = { x:dx/L, z:dz/L }, rr = { x:-d.z, z:d.x }, off = w*.25;
  return { d, p0:{ x:A.x + d.x*A.R + rr.x*off, z:A.z + d.z*A.R + rr.z*off }, p1:{ x:B.x - d.x*B.R + rr.x*off, z:B.z - d.z*B.R + rr.z*off } };
}
function startEdge(C, ag, a, b, w){
  const E = edgePts(C, a, b, w);
  ag.a = a; ag.b = b; ag.E = E;
  ag.piece = { line:true, p0:E.p0, p1:E.p1, len:Math.max(.5, Math.hypot(E.p1.x-E.p0.x, E.p1.z-E.p0.z)) };
}
function bez(P0, Pc, P2, u){ const k = 1-u; return { x:k*k*P0.x + 2*k*u*Pc.x + u*u*P2.x, z:k*k*P0.z + 2*k*u*Pc.z + u*u*P2.z }; }
function turnAt(C, ag){
  const B = C.nodes[ag.b], d1 = ag.E.d;
  let opts = B.nb.filter(e => e.to !== ag.a); if (!opts.length) opts = B.nb;
  const straight = opts.find(e => { const N = C.nodes[e.to]; const dx = N.x-B.x, dz = N.z-B.z; return (dx*d1.x + dz*d1.z)/Math.hypot(dx,dz) > .9; });
  const pick = (straight && ag.rnd() < .5) ? straight : opts[Math.floor(ag.rnd()*opts.length)];
  const E2 = edgePts(C, ag.b, pick.to, pick.w);
  const P0 = ag.E.p1, P2 = E2.p0, cr = d1.x*E2.d.z - d1.z*E2.d.x;
  let Pc;
  if (Math.abs(cr) < 1e-3) Pc = { x:(P0.x+P2.x)/2, z:(P0.z+P2.z)/2 };
  else { const qx = P2.x-P0.x, qz = P2.z-P0.z, tt = (qx*E2.d.z - qz*E2.d.x)/cr; Pc = { x:P0.x + d1.x*tt, z:P0.z + d1.z*tt }; }
  let len = 0, p = P0;
  for (let k=1;k<=8;k++){ const q = bez(P0, Pc, P2, k/8); len += Math.hypot(q.x-p.x, q.z-p.z); p = q; }
  ag.piece = { line:false, P0, Pc, P2, len:Math.max(.5, len), next:{ a:ag.b, b:pick.to, w:pick.w } };
}
function makeAgent(C, seed, speed){
  const rnd = rng(seed), a = Math.floor(rnd()*C.nodes.length), e = C.nodes[a].nb[Math.floor(rnd()*C.nodes[a].nb.length)];
  const ag = { rnd, speed, s:0, x:0, z:0, yaw:0 };
  startEdge(C, ag, a, e.to, e.w); ag.s = ag.piece.len*rnd(); stepAgent(C, ag, 0);
  return ag;
}
function stepAgent(C, ag, dt){
  ag.s += ag.speed*(ag.piece.line ? 1 : .55)*dt;
  let guard = 0;
  while (ag.s >= ag.piece.len && guard++ < 4){
    const over = ag.s - ag.piece.len;
    if (ag.piece.line) turnAt(C, ag); else { const n = ag.piece.next; startEdge(C, ag, n.a, n.b, n.w); }
    ag.s = over;
  }
  const P = ag.piece, u = Math.min(1, ag.s/P.len);
  if (P.line){ ag.x = P.p0.x + (P.p1.x-P.p0.x)*u; ag.z = P.p0.z + (P.p1.z-P.p0.z)*u; ag.yaw = Math.atan2(ag.E.d.x, ag.E.d.z); }
  else {
    const q = bez(P.P0, P.Pc, P.P2, u); ag.x = q.x; ag.z = q.z;
    const tx = 2*(1-u)*(P.Pc.x-P.P0.x) + 2*u*(P.P2.x-P.Pc.x), tz = 2*(1-u)*(P.Pc.z-P.P0.z) + 2*u*(P.P2.z-P.Pc.z);
    if (tx || tz) ag.yaw = Math.atan2(tx, tz);
  }
}

/* эмблема ALAMIR SECURITY как SVG-контур (из трассированного логотипа) */
const EMBLEM_SVG = (() => {
  let minX = 9, maxX = -9, minY = 9, maxY = -9;
  const ring = pts => 'M' + pts.map(p => { minX = Math.min(minX,p[0]); maxX = Math.max(maxX,p[0]); minY = Math.min(minY,-p[1]); maxY = Math.max(maxY,-p[1]); return `${p[0]} ${-p[1]}`; }).join('L') + 'Z';
  const d = EMBLEM.map(s => ring(s.o) + s.h.map(ring).join('')).join('');
  const vb = `${(minX-.04).toFixed(3)} ${(minY-.04).toFixed(3)} ${(maxX-minX+.08).toFixed(3)} ${(maxY-minY+.08).toFixed(3)}`;
  return { d, vb, html:`<svg viewBox="${vb}" aria-hidden="true"><path fill-rule="evenodd" d="${d}"/></svg>` };
})();

/* Время в Алматы (UTC+5): ночь с 19:00 до 7:00 */
function almatyNight(){ const h = (new Date().getUTCHours() + 5) % 24; return h >= 19 || h < 7; }

/* ---------- 3D-движок карты (Three.js) ---------- */
function windowTextures(){
  const mk = night => {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    const r = rng(night ? 9 : 3);
    g.fillStyle = night ? '#000' : '#D9D4CC'; g.fillRect(0, 0, 256, 256);
    for (let i=0;i<8;i++) for (let j=0;j<8;j++){
      const x = i*32 + 7, y = j*32 + 8;
      if (night){
        const v = r();
        if (v < .34) { g.fillStyle = v < .06 ? '#BFD8FF' : (v < .22 ? '#FFD49A' : '#FFE9C6'); g.fillRect(x, y, 18, 17); }
      } else { g.fillStyle = r() < .2 ? '#5B6876' : '#3E4853'; g.fillRect(x, y, 18, 17); g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x, y, 18, 3); }
    }
    g.fillStyle = night ? '#000' : '#D9D4CC'; g.fillRect(0, 0, 4, 4);
    const tx = new THREE.CanvasTexture(c);
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.encoding = THREE.sRGBEncoding; tx.anisotropy = 4;
    return tx;
  };
  return { day:mk(false), night:mk(true) };
}

/* один общий меш для всех зданий: окна по метрам фасада, цвет — по вершинам */
function buildingsGeometry(list){
  const pos = [], nor = [], uv = [], colr = [], idx = [];
  const WX = 24, WY = 28; let v = 0;
  const tmp = new THREE.Color();
  for (const b of list){
    const x0 = b.x - b.w/2, x1 = b.x + b.w/2, z0 = b.z - b.d/2, z1 = b.z + b.d/2, h = b.h, u0 = b.u || 0;
    tmp.set(b.c).convertSRGBToLinear();
    const face = (P, n, w, top) => {
      const U = top ? [[.004,.004],[.004,.004],[.004,.004],[.004,.004]] : [[u0,0],[u0 + w/WX,0],[u0 + w/WX,h/WY],[u0,h/WY]];
      const k = top ? .72 : 1;
      for (let q=0;q<4;q++){ pos.push(P[q][0], P[q][1], P[q][2]); nor.push(n[0], n[1], n[2]); uv.push(U[q][0], U[q][1]); colr.push(tmp.r*k, tmp.g*k, tmp.b*k); }
      idx.push(v, v+1, v+2, v, v+2, v+3); v += 4;
    };
    face([[x0,0,z1],[x1,0,z1],[x1,h,z1],[x0,h,z1]], [0,0,1], b.w);
    face([[x1,0,z0],[x0,0,z0],[x0,h,z0],[x1,h,z0]], [0,0,-1], b.w);
    face([[x1,0,z1],[x1,0,z0],[x1,h,z0],[x1,h,z1]], [1,0,0], b.d);
    face([[x0,0,z0],[x0,0,z1],[x0,h,z1],[x0,h,z0]], [-1,0,0], b.d);
    face([[x0,h,z1],[x1,h,z1],[x1,h,z0],[x0,h,z0]], [0,1,0], 0, true);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colr, 3));
  g.setIndex(idx);
  g.computeBoundingSphere();
  return g;
}

function radialTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function emblemShapes(){
  return EMBLEM.map(s => {
    const sh = new THREE.Shape(s.o.map(p => new THREE.Vector2(p[0], p[1])));
    s.h.forEach(h => sh.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))));
    return sh;
  });
}

function sideDecal(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#F2F2EF'; g.fillRect(0, 0, 512, 64);
  g.fillStyle = '#D32031'; g.font = '700 38px "Roboto Condensed","Arial Narrow",Arial,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('ALAMIR SECURITY', 256, 34);
  const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding; return tx;
}

  const em = new THREE.Mesh(shared.emblemFlat, new THREE.MeshStandardMaterial({ color:col('#D32031'), emissive:col('#7A0E16'), roughness:.4, side:THREE.DoubleSide }));
  em.scale.setScalar(.48); em.rotation.x = -Math.PI/2; em.position.set(0, 1.675, -.75); car.add(em);

  const beam = new THREE.Mesh(shared.cone, beamMat); beam.rotation.x = -Math.PI/2; beam.position.set(0, .45, 2.3 + 7); car.add(beam);

  const roadMesh = instanced(UNIT_BOX, roadMat, roadM, false); roadMesh.receiveShadow = true; scene.add(roadMesh);
  const dashes = [], yellow = [], zebra = [];
  const segs = (r, fn) => { const cuts = r.ns ? C.zs : C.xs; for (let k=0;k<cuts.length-1;k++) fn(cuts[k], cuts[k+1]); };
  C.roads.forEach(r => {
    segs(r, (a, b) => {
      const pad = 22, A = a + pad, Bq = b - pad; if (Bq <= A) return;

        if (solid){ const m = (A+Bq)/2, L = Bq - A; list.push(r.ns ? boxM(r.x0 + off, .33, m, .35, .04, L) : boxM(m, .33, r.z0 + off, L, .04, .35)); return; }
        for (let p = A; p < Bq - 3; p += 12) list.push(r.ns ? boxM(r.x0 + off, .33, p + 2, .3, .04, 4) : boxM(p + 2, .33, r.z0 + off, 4, .04, .3));
      };

  details.add(instanced(UNIT_BOX, new THREE.MeshStandardMaterial({ color:col('#E9E6DE'), roughness:.6 }), zebra, false));

  /* здания: обычные + объекты охраны */
  const tex = windowTextures();

  const lmGlass = [], lmPlain = [], siteCols = [], siteSlabs = [], chim = [];

    o.lm.chimneys.forEach(c => chim.push(c));
    if (o.lm.site){
      const FH = 3.4, bx = o.x + 10, bz = o.z - 20;
      for (let f=0; f<15; f++){
        siteSlabs.push(boxM(bx, f*FH + FH - .2, bz, 62, .4, 40));
        for (let i=0;i<5;i++) for (let k=0;k<4;k++) siteCols.push(boxM(bx - 30 + i*15, f*FH + FH/2, bz - 19 + k*12.6, .7, FH, .7));

  const plainMesh = instanced(UNIT_BOX, new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.8, metalness:.2 }), lmPlain.map(b => boxM(b.x, b.h/2, b.z, b.w, b.h, b.d)));

  if (site){
    const H = 66, L = 46, cx = site.x - 55, cz = site.z + 25, cmat = new THREE.MeshStandardMaterial({ color:col('#E2B12E'), roughness:.55, metalness:.3 });
    const bars = [];
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b]) => bars.push(barMatrix(V(cx+a, 0, cz+b), V(cx+a, H, cz+b), .3)));
    for (let y=2; y<H; y+=3){ bars.push(barMatrix(V(cx-1, y, cz-1), V(cx+1, y+3, cz-1), .15), barMatrix(V(cx+1, y, cz+1), V(cx-1, y+3, cz+1), .15)); }

    const tip = new THREE.Mesh(new THREE.SphereGeometry(.9, 8, 6), new THREE.MeshStandardMaterial({ color:col('#300'), emissive:col('#FF2A1A'), emissiveIntensity:2 })); tip.position.set(L - 10, 1.2, 0); craneJib.add(tip);

/* ---------- 2ГИС MapGL JS API (работает на своём домене с ключом; здесь не проверялся) ---------- */
const toLngLat = (x, z) => [MAP_CFG.center[0] + x/(111320*Math.cos(MAP_CFG.center[1]*Math.PI/180)), MAP_CFG.center[1] - z/110540];
function dgisEngine(root, host){
  const opts = { center:MAP_CFG.center, zoom:MAP_CFG.zoom || 10.7, pitch:0, rotation:0, key:MAP_CFG.dgisKey, zoomControl:false };
  const night0 = MAPC.night && MAP_CFG.dgisStyleNight;
  if (night0) opts.style = MAP_CFG.dgisStyleNight; else if (MAP_CFG.dgisStyleDay) opts.style = MAP_CFG.dgisStyleDay;
  const map = new mapgl.Map(host, opts);
  const mk = MAP_OBJECTS.map(o => {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'mk dg'; el.dataset.obj = o.id;
    el.innerHTML = `<span class="mk-ic">${EMBLEM_SVG.html}</span><span class="mk-tx">${L(o.name)}</span>`;
    el.addEventListener('click', e => { e.stopPropagation(); MAPC.select({ obj:o }); });
    const m = new mapgl.HtmlMarker(map, { coordinates:toLngLat(o.x, o.z), html:el, interactive:true, anchor:[0, 0] });
    return { o, el, m };
  });
  /* машины едут по заданным маршрутам (MAP_CFG.dgisRoutes), без маршрутов не показываются */
  const cars = MAP_CFG.dgisRoutes.map((route, k) => {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'dgcar'; el.setAttribute('aria-label', L(UI.mapPatrol));
    const a = { id:'p' + (k+1), route, s:0, x:0, z:0, el };
    el.addEventListener('click', e => { e.stopPropagation(); MAPC.select({ patrol:a }); });
    a.m = new mapgl.HtmlMarker(map, { coordinates:route[0], html:el, interactive:true });
    let len = 0; a.seg = route.slice(1).map((p, i) => { const q = route[i]; const l = Math.hypot((p[0]-q[0])*81000, (p[1]-q[1])*111000); len += l; return l; }); a.len = len;
    return a;
  });
  let raf = 0, last = performance.now(), timers = [];
  const loop = now => {
    raf = requestAnimationFrame(loop); const dt = Math.min(.05, (now - last)/1000); last = now;
    cars.forEach(a => {
      if (!a.len) return; a.s = (a.s + dt*13) % a.len; let s = a.s, i = 0; while (i < a.seg.length - 1 && s > a.seg[i]){ s -= a.seg[i]; i++; }
      const p = a.route[i], q = a.route[i+1], f = a.seg[i] ? s/a.seg[i] : 0;
      a.m.setCoordinates([p[0] + (q[0]-p[0])*f, p[1] + (q[1]-p[1])*f]);
      a.el.classList.toggle('on', MAPC.isSel(a)); a.el.style.display = MAPC.filters.patrol === false ? 'none' : '';
    });
  };
  raf = requestAnimationFrame(loop);
  map.on('click', () => MAPC.select(null));
  const safe = fn => { try { fn(); } catch(e){ console.warn(e); } };
  const center = toLngLat(60, 180);
  return {
    kind:'2gis', patrols:cars,
    setNight(v){ if (MAP_CFG.dgisStyleNight && MAP_CFG.dgisStyleDay) safe(() => map.setStyleById(v ? MAP_CFG.dgisStyleNight : MAP_CFG.dgisStyleDay)); },
    setFlat(v){ safe(() => map.setPitch(v ? 0 : 50, { duration:600 })); },
    zoom(f){ safe(() => map.setZoom(map.getZoom() + (f < 1 ? 1 : -1), { duration:300 })); },
    rotate(a){ safe(() => map.setRotation(map.getRotation() - a*180/Math.PI, { duration:400 })); },
    north(){ safe(() => map.setRotation(0, { duration:500 })); },
    goto(){},
    focus(o){ safe(() => { map.setCenter(toLngLat(o.x, o.z), { duration:900 }); map.setZoom(16.2, { duration:900 }); }); },
    follow(){},
    setFilter(){ mk.forEach(q => { q.el.style.display = MAPC.filters[q.o.cat] === false ? 'none' : ''; }); },
    startIntro(){
      root.classList.add('dg-hide-mk');
      timers.push(setTimeout(() => safe(() => { map.setCenter(center, { duration:3600 }); map.setZoom(13.4, { duration:3600 }); map.setPitch(52, { duration:3600 }); map.setRotation(-24, { duration:3600 }); }), 300));
      let it = 0; const tick = setInterval(() => { it += .1; MAPC.introTick(it); if (it > 3.6) root.classList.remove('dg-hide-mk'); if (it >= 6.2){ clearInterval(tick); MAPC.introDone(); } }, 100);
      timers.push(tick);
    },
    skipIntro(){ timers.forEach(x => { clearTimeout(x); clearInterval(x); }); timers = []; root.classList.remove('dg-hide-mk'); safe(() => { map.setCenter(center); map.setZoom(13.4); map.setPitch(52); map.setRotation(-24); }); MAPC.introDone(); },
    destroy(){ cancelAnimationFrame(raf); timers.forEach(x => { clearTimeout(x); clearInterval(x); }); safe(() => mk.forEach(q => q.m.destroy())); safe(() => cars.forEach(a => a.m.destroy())); safe(() => map.destroy()); }
  };
}

  /* мини-карта в духе игровых HUD: вращается вместе с камерой, «С» показывает север */
  miniStatic:null,

    const cv = document.createElement('canvas'); cv.width = cv.height = N; const g = cv.getContext('2d');

    C.roads.forEach(r => R((r.x0+r.x1)/2, (r.z0+r.z1)/2, r.ns ? r.w : (r.x1-r.x0) + r.w, r.ns ? (r.z1-r.z0) + r.w : r.w, r.major ? '#A9A6A0' : '#6E6C69'));

    });
    g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.moveTo(c, c); g.arc(c, c, rad, -Math.PI/2 - .5, -Math.PI/2 + .5); g.closePath(); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(c, c - 7*dpr); g.lineTo(c + 5*dpr, c + 5*dpr); g.lineTo(c, c + 2*dpr); g.lineTo(c - 5*dpr, c + 5*dpr); g.closePath(); g.fill();
    g.restore();

  }
};

/* =====================================================================
   КАРТА АДРЕСОВ В СТИЛЕ GTA (страница «Контакты»)
   Leaflet 1.9.4 + тайлы OpenStreetMap, тёмный стиль — CSS-фильтром слоя тайлов.
   2ГИС здесь не используем: по правилам проекта данные 2ГИС — только через
   MapGL JS API с ключом (см. CLAUDE.md), сырые тайлы 2ГИС без ключа не берём.
   Внимание: имя L в этом файле занято функцией перевода, Leaflet — window.L.
   ===================================================================== */
const GMAP_CFG = {
  tiles:{ url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' },
  city:[43.2380, 76.9450], cityZoom:12, locZoom:16, radarZoom:16,
  bounds:[[43.03, 76.62], [43.45, 77.25]],      // карта не уводится за пределы Алматы
  minLoad:1800, maxLoad:8000                     // экран загрузки: минимум и страховочный таймаут, мс
};
const LEAFLET_SRC = {
  js:{ href:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js', sri:'sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==' },
  css:{ href:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css', sri:'sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==' }
};
/* Адреса компании. Координаты здания — OpenStreetMap (Nominatim), сверены с точкой из ссылки 2ГИС. */
const OFFICE_LOCS = [
  { id:'makataeva-127v', code:'ALAMIR SECURITY',
    addr:{ ru:'ул. Макатаева, 127В', kk:'Мақатаев көшесі, 127В' },
    note:{ ru:'Алмалинский район, Алматы', kk:'Алмалы ауданы, Алматы' },

  gMap:{ru:'Карта адресов ALAMIR SECURITY',kk:'ALAMIR SECURITY мекенжайлар картасы'},
  gList:{ru:'Адреса',kk:'Мекенжайлар'},
  gNorth:{ru:'Север сверху',kk:'Солтүстік жоғарыда'},
  gCoords:{ru:'Координаты центра карты',kk:'Карта ортасының координаттары'},
  gTip:{ru:'Совет',kk:'Кеңес'},
  gLoading:{ru:'Загружаем карту',kk:'Карта жүктелуде'},
  gFail:{ru:'Карта недоступна — выберите адрес из списка',kk:'Карта қолжетімсіз — мекенжайды тізімнен таңдаңыз'},
  gRoute:{ru:'Маршрут',kk:'Бағыт'},
  gRouteLink:{ru:'Маршрут в 2ГИС',kk:'2ГИС-тегі бағыт'},
  gOnMap:{ru:'Показать на карте',kk:'Картадан көрсету'},
  gRouteAria:{ru:'Маршрут в 2ГИС (откроется в новой вкладке)',kk:'2ГИС-тегі бағыт (жаңа бетте ашылады)'},
  gRadar:{ru:'Мини-радар: адрес на карте',kk:'Шағын радар: картадағы мекенжай'},
  gTipWheel:{ru:'Колесо мыши не приближает карту — используйте кнопки «+» и «−».',kk:'Тышқан дөңгелегі картаны жақындатпайды — «+» және «−» батырмаларын қолданыңыз.'}
});

/* «Советы» на экране загрузки — только факты, которые уже есть на сайте */

/* «Маршрут в 2ГИС · Показать на карте» — под адресом в подвале и в контактах */
const addrLinks = (o = OFFICE_LOCS[0]) => `<a href="${o.route}" target="_blank" rel="noopener noreferrer" aria-label="${t('gRouteAria')}">${t('gRouteLink')}</a> · <a href="#contacts/${o.id}">${t('gOnMap')}</a>`;
const gtaLL = (lat, lng) => `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'} · ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
const gtaArrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

function gtaSection(){

<section class="gta-sec darkctx" id="gta-sec" aria-labelledby="gta-h">

      <div class="gta-in">

        <div class="gta-load" id="gta-load" role="status" aria-label="${t('gLoading')}">

      </div>
    </div>
    <div class="gta-card" id="gta-card" hidden></div>
